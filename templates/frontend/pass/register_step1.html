{{ define "frontend/pass/register_step1.html" }}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="author" content="order by dede58.com"/>
	<title>用户注册</title>
	<link rel="stylesheet" href="/static/frontend/css/pass.css"/>
	<script src="/static/frontend/js/jquery-1.10.1.js"></script>
	<script src="/static/frontend/js/pass.js"></script>
</head>
<body class="register_page">
	<header class="auth-header">
		<a class="brand" href="/" aria-label="商城首页">
			<img src="/static/frontend/image/logo_top.png" alt="nest小E">
		</a>
	</header>

	<main class="auth-main" id="main">
		<section class="auth-card" aria-labelledby="register-title">
			<div class="auth-heading">
				<h1 id="register-title">注册账户</h1>
				<p>已有账户？<a href="/pass/login">直接登录</a></p>
			</div>

			<form id="registerForm" action="/pass/sendCode" method="get" novalidate>
				<input type="hidden" name="captchaId" id="captchaId">

				<div class="field">
					<label for="phone">手机号</label>
					<input class="form_input" type="tel" inputmode="numeric" name="phone" id="phone" placeholder="请填写正确的手机号" aria-describedby="phone-error">
					<p class="field-error" id="phone-error" role="alert"></p>
				</div>

				<div class="field">
					<label for="verifyCode">图形验证码</label>
					<div class="captcha-row">
						<input type="text" id="verifyCode" name="verifyCode" autocomplete="off" placeholder="请输入图形验证码" aria-describedby="verifyCode-error">
						<img id="captchaImg" src="" alt="图形验证码" title="点击刷新验证码">
					</div>
					<p class="field-error" id="verifyCode-error" role="alert"></p>
				</div>

				<div class="form-error" id="form-error" role="alert" aria-live="polite"></div>

				<button class="submit" type="submit" id="registerButton">立即注册</button>

				<div class="privacy_box">
					<label class="select-privacy">
						<input type="checkbox" checked>
						<span>注册帐号即表示您同意并愿意遵守 <a href="https://static.account.xiaomi.com/html/agreement/account/cn.html" target="_blank" rel="noopener">用户协议</a> 和 <a href="https://www.mi.com/about/privacy/" target="_blank" rel="noopener">隐私政策</a></span>
					</label>
				</div>
			</form>
		</section>
	</main>
</body>
</html>
{{end}}
