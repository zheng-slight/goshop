{{ define "frontend/pass/login.html" }}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="author" content="order by frontend"/>
	<title>会员登录</title>
	<link rel="stylesheet" href="/static/frontend/css/pass.css" />
	<script src="/static/frontend/js/jquery-1.10.1.js"></script>
	<script src="/static/frontend/js/pass.js"></script>
</head>
<body class="login_page">
	<header class="auth-header">
		<a class="brand" href="/" aria-label="商城首页">
			<img src="/static/frontend/image/mistore_logo.png" alt="商城">
		</a>
	</header>

	<main class="auth-main" id="main">
		<section class="auth-card" aria-labelledby="login-title">
			<div class="auth-heading">
				<h1 id="login-title">会员登录</h1>
				<p>您还不是我们的会员？<a href="/pass/registerStep1">立即注册</a></p>
			</div>

			<form id="loginForm" action="/pass/doLogin" method="post" novalidate>
				<input type="hidden" name="prevPage" id="prevPage" value="{{.prevPage}}">
				<input type="hidden" name="captchaId" id="captchaId">

				<div class="field">
					<label for="phone">手机号</label>
					<input class="shurukuang" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="请输入手机号" aria-describedby="phone-error">
					<p class="field-error" id="phone-error" role="alert"></p>
				</div>

				<div class="field">
					<label for="password">密码</label>
					<input class="shurukuang" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="password-error">
					<p class="field-error" id="password-error" role="alert"></p>
				</div>

				<div class="field">
					<label for="captchaVal">验证码</label>
					<div class="captcha-row">
						<input class="yanzhengma" id="captchaVal" name="captchaVal" type="text" autocomplete="off" placeholder="请输入验证码" aria-describedby="captchaVal-error">
						<img id="captchaImg" src="" alt="图形验证码" title="点击刷新验证码">
					</div>
					<p class="field-error" id="captchaVal-error" role="alert"></p>
				</div>

				<div class="form-error" id="form-error" role="alert" aria-live="polite"></div>

				<button class="submit" type="submit" id="doLogin">立即登录</button>
			</form>
		</section>
	</main>

	<footer class="auth-footer">
		<div class="copyright">简体 | 繁体 | English | 常见问题</div>
		<div class="copyright">小E公司版权所有</div>
	</footer>
</body>
</html>
{{end}}
