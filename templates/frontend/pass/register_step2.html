{{ define "frontend/pass/register_step2.html" }}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="author" content="order by dede58.com" />
	<title>用户注册</title>
	<link rel="stylesheet" href="/static/frontend/css/pass.css" />
	<script src="/static/frontend/js/jquery-1.10.1.js"></script>
	<script src="/static/frontend/js/pass.js"></script>
</head>
<body class="register_page">
	<header class="auth-header">
		<a class="brand" href="/" aria-label="商城首页">
			<img src="/static/frontend/image/logo_top.png" alt="nest小E">
		</a>
	</header>

	<main class="auth-main" id="main">
		<section class="auth-card" aria-labelledby="register-title">
			<div class="auth-heading">
				<h1 id="register-title">注册账户</h1>
				<p>验证码已通过短信发送至 {{.phone}}，请输入完成验证。</p>
			</div>

			<form id="smsForm" action="/pass/validateSmsCode" method="get" novalidate>
				<input type="hidden" id="phone" name="phone" value="{{.phone}}">
				<input type="hidden" id="sign" name="sign" value="{{.sign}}">
				<input type="hidden" id="verifyCode" name="verifyCode" value="{{.verifyCode}}">

				<div class="field">
					<label for="smsCode">短信验证码</label>
					<div class="captcha-row">
						<input type="text" inputmode="numeric" id="smsCode" name="smsCode" autocomplete="one-time-code" placeholder="请输入验证码" aria-describedby="smsCode-error">
						<button class="resend" type="button" id="sendCode">重新发送</button>
					</div>
					<p class="field-error" id="smsCode-error" role="alert"></p>
				</div>

				<div class="form-error" id="form-error" role="alert" aria-live="polite"></div>

				<button class="submit" type="submit" id="nextStep">下一步</button>
				<button class="return" type="button" id="returnButton">返回</button>
			</form>
		</section>
	</main>
</body>
</html>
{{end}}
